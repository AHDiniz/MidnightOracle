name: midnight_oracle_backend

services:
  db:
    image: postgres:17
    container_name: postgres
    ports:
      - "5432:5432"
    # Se a gente quiser a opção de deletar o container sem perder os dados
    # volumes:
    #   - postgres_devweb:/var/lib/postgresql/data
    env_file:
      - .env

  squirrel:
    build:
      context: .
      dockerfile: Dockerfile.squirrel
    profiles:
      - gen
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - type: bind
        source: ./src/
        target: /server/src

  cigogne:
    build:
      context: .
      dockerfile: Dockerfile.cigogne
    profiles:
      - migrate
    env_file:
      - .env
    depends_on:
      - db
