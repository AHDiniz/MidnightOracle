name: midnight_oracle

services:
   db:
    image: postgres:17
    container_name: postgres
    ports:
      - "5432:5432"
    # Se a gente quiser a opção de deletar o container sem perder os dados
    # volumes:
    #   - postgres_devweb:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
